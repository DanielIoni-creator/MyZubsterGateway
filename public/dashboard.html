<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyZubster Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f6fa; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: #2c3e50; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .header h1 { font-size: 24px; }
        .header .subtitle { opacity: 0.8; font-size: 14px; margin-top: 5px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #7f8c8d; font-size: 14px; text-transform: uppercase; margin-bottom: 10px; }
        .stat-card .number { font-size: 32px; font-weight: bold; color: #2c3e50; }
        .stat-card .label { color: #95a5a6; font-size: 12px; margin-top: 5px; }
        .section { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section h2 { color: #2c3e50; margin-bottom: 15px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-ok { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }
        .status-warning { background: #fff3cd; color: #856404; }
        .refresh-btn { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .refresh-btn:hover { background: #2980b9; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
        .loading { text-align: center; padding: 40px; color: #7f8c8d; }
        .monero-status { margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 MyZubster Admin Dashboard</h1>
            <div class="subtitle">Gateway v1.0.0 - Sistema di pagamenti Monero</div>
        </div>

        <button class="refresh-btn" onclick="loadStats()">🔄 Aggiorna Dati</button>
        <br><br>

        <div id="stats-container">
            <div class="loading">⏳ Caricamento statistiche...</div>
        </div>

        <div class="section">
            <h2>📊 Dati Raw (JSON)</h2>
            <pre id="raw-data">Nessun dato caricato</pre>
        </div>
    </div>

    <script>
        async function loadStats() {
            const container = document.getElementById('stats-container');
            const rawData = document.getElementById('raw-data');
            
            container.innerHTML = '<div class="loading">⏳ Caricamento...</div>';
            
            try {
                const response = await fetch('/api/admin/stats');
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Errore sconosciuto');
                }

                renderStats(data.data);
                rawData.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                container.innerHTML = `<div class="loading" style="color:red;">❌ Errore: ${error.message}</div>`;
                rawData.textContent = 'Errore: ' + error.message;
            }
        }

        function renderStats(stats) {
            const container = document.getElementById('stats-container');
            
            const cards = [
                { label: '👥 Utenti', value: stats.users?.total || 0 },
                { label: '📦 Ordini Totali', value: stats.orders?.total || 0 },
                { label: '📦 Ordini Aperti', value: stats.orders?.open || 0 },
                { label: '💳 Pagamenti Totali', value: stats.payments?.total || 0 },
                { label: '⏳ Pagamenti Pendenti', value: stats.payments?.pending || 0 },
                { label: '✅ Pagamenti Completati', value: stats.payments?.completed || 0 },
                { label: '🗄️ Collezioni DB', value: stats.database?.collections || 0 },
                { label: '⏱️ Uptime', value: formatUptime(stats.uptime) },
            ];

            let html = '<div class="stats-grid">';
            cards.forEach(card => {
                html += `
                    <div class="stat-card">
                        <h3>${card.label}</h3>
                        <div class="number">${card.value}</div>
                    </div>
                `;
            });
            html += '</div>';

            // Status servizi
            html += `<div class="section" style="margin-top:20px;">
                <h2>🔧 Stato Servizi</h2>
                <div>
                    <p><strong>MongoDB:</strong> <span class="status-badge ${stats.database ? 'status-ok' : 'status-error'}">${stats.database ? '✅ Connesso' : '❌ Disconnesso'}</span></p>
                    <p><strong>Monero:</strong> <span class="status-badge status-warning">⏳ In attesa...</span></p>
                    <p><strong>Node.js:</strong> ${stats.nodeVersion || 'N/A'}</p>
                    <p><strong>Piattaforma:</strong> ${stats.platform || 'N/A'}</p>
                    <p><strong>Ultimo aggiornamento:</strong> ${new Date(stats.timestamp).toLocaleString()}</p>
                </div>
            </div>`;

            container.innerHTML = html;
        }

        function formatUptime(seconds) {
            if (!seconds) return '0s';
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            if (days > 0) return `${days}d ${hours}h ${mins}m`;
            if (hours > 0) return `${hours}h ${mins}m ${secs}s`;
            if (mins > 0) return `${mins}m ${secs}s`;
            return `${secs}s`;
        }

        // Carica i dati all'avvio
        loadStats();

        // Aggiornamento automatico ogni 60 secondi
        setInterval(loadStats, 60000);
    </script>
</body>
</html>
