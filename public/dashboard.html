<!DOCTYPE html>
<html>
<head><title>MyZubster Status</title></head>
<body>
<h1>System Status Dashboard</h1>
<p>Loading status...</p>
<script>
fetch('/api/status')
  .then(r => r.json())
  .then(data => {
    document.body.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
  });
</script>
</body>
</html>
