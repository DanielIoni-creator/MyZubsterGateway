version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: myzubster-gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/myzubster}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - MONERO_RPC_URL=${MONERO_RPC_URL:-http://monero-wallet:18082}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - myzubster-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  biodiversity-ml:
    build:
      context: ./biodiversity-ml
      dockerfile: Dockerfile.ml
    container_name: myzubster-biodiversity-ml
    ports:
      - "${ML_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      - MODEL_PATH=/app/models
    volumes:
      - ml-models:/app/models
    restart: unless-stopped
    networks:
      - myzubster-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  websocket:
    build:
      context: ./websocket-optimized
      dockerfile: Dockerfile.ws
    container_name: myzubster-websocket
    ports:
      - "${WS_PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - myzubster-net

  mongo:
    image: mongo:7
    container_name: myzubster-mongo
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=myzubster
    restart: unless-stopped
    networks:
      - myzubster-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myzubster-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - myzubster-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:
  redis-data:
  ml-models:

networks:
  myzubster-net:
    driver: bridge
