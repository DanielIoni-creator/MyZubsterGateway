services:
  mongodb:
    image: mongo:7-jammy
    container_name: myzubster-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-securepassword}
      MONGO_INITDB_DATABASE: myzubster
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - myzubster-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myzubster-gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-securepassword}@mongodb:27017/myzubster?authSource=admin
      - MONERO_RPC_URL=${MONERO_RPC_URL:-http://node.moneroworld.com:18081}
      - MONERO_RPC_USERNAME=${MONERO_RPC_USERNAME:-}
      - MONERO_RPC_PASSWORD=${MONERO_RPC_PASSWORD:-}
      - MONERO_NETWORK=${MONERO_NETWORK:-mainnet}
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${API_KEY}
      - MONERO_WALLET_ADDRESS=${MONERO_WALLET_ADDRESS}
      - MONERO_WALLET_PASSWORD=${MONERO_WALLET_PASSWORD}
      - MONERO_MIN_CONFIRMATIONS=${MONERO_MIN_CONFIRMATIONS:-10}
      - BCRYPT_SALT=${BCRYPT_SALT:-10}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MARKETPLACE_WEBHOOK_URL=${MARKETPLACE_WEBHOOK_URL:-http://marketplace:4000/webhook}
    ports:
      - "3001:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - myzubster-network
    volumes:
      - ./public:/app/public
      - gateway_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
    driver: local
  gateway_logs:
    driver: local

networks:
  myzubster-network:
    driver: bridge
