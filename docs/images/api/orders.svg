ospace" font-size="11" fill="#9b95ab">json</text><text x="332" y="354" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#86efac">"{"</tspan></text><text x="332" y="373" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#86efac">"  \"id\": \"o_91\","</tspan></text><text x="332" y="392" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#86efac">"  \"status\": \"open\","</tspan></text><text x="332" y="411" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#86efac">"  \"budget\": 250,"</tspan></text><text x="332" y="430" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#86efac">"  \"currency\": \"XMR\""</tspan></text><text x="332" y="449" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="12.5" xml:space="preserve"><tspan fill="#86efac">"}"</tspan></text><rect x="296" y="481" width="952" height="312" rx="16" fill="#14151d" stroke="#2a2c38"/><rect x="314" y="499" width="77.5" height="26" rx="7" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.5"/><text x="352.75" y="516" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-weight="700" font-size="12" fill="#fbbf24">PATCH</text><text x="403.5" y="517" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace" font-size="14" fill="#ecebf2">/api/orders/:id/status</text><text x="314" y="543" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" fill="#9b95ab">Update order status (completed, cancelled).</text><text x="314" y="563" font-family="'Inter','Segoe UI',system-ui,-apple-system,san