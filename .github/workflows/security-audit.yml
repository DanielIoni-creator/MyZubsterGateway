name: Security Audit

on:
  schedule:
    - cron: '0 0 * * *'  # Esegue ogni giorno alle 00:00 UTC
  workflow_dispatch:      # Permette di eseguirlo manualmente

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || echo "⚠️ Vulnerabilità trovate, ma non bloccante"

      - name: Run security scan (optional)
        run: |
          echo "🔒 Security audit completato"
          echo "📊 Data: $(date)"
        continue-on-error: true
