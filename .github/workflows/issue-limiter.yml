name: Issue Limiter

on:
  issues:
    types: [opened]

jobs:
  check-xmr-limit:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.issue.labels.*.name, 'bounty-xmr') }}
    steps:
      - name: Check user's recent XMR bounties
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.event.issue.user.login }}
        run: |
          # Conta le issue aperte con label bounty-xmr nelle ultime 24h
          XMR_ISSUES=$(gh api repos/${{ github.repository }}/issues \
            -f creator="$USERNAME" \
            -f state=open \
            -f since=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ') \
            --jq '[.[] | select(.labels | any(.name == "bounty-xmr"))] | length')
          
          echo "xmr_count=$XMR_ISSUES" >> $GITHUB_OUTPUT

      - name: Close issue if limit exceeded
        if: ${{ steps.check.outputs.xmr_count >= 1 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER \
            -X PATCH -f state=closed \
            -f body="$(gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER --jq .body)\n\n---\n⚠️ **Limite XMR raggiunto**: hai già aperto un bounty in XMR oggi. Le issue XMR sono limitate a 1 al giorno. Per aprire un bounty in MYZ (illimitato), usa il template e seleziona MYZ."
          gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments \
            -X POST -f body="⚠️ @${{ github.actor }} – hai già aperto un bounty in XMR oggi. **I bounty in MYZ sono illimitati**, puoi aprirne quanti vuoi. Seleziona MYZ nel template per evitar limiti."

      - name: Add XMR label to open issues
        if: ${{ steps.check.outputs.xmr_count < 1 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          gh api repos/${{ github.repository }}/issues/$ISSUE_NUMBER/labels \
            -X POST -f labels='["bounty-xmr"]'
