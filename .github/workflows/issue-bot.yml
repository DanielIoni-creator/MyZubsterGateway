name: Issue Bot

on:
  issue_comment:
    types: [created]

jobs:
  handle-claim:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, 'I take this')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assign issue
        uses: actions-ecosystem/action-add-assignees@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          assignees: ${{ github.event.comment.user.login }}
          
      - name: Add comment
        uses: actions-ecosystem/action-create-comment@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ✅ Issue assigned to @${{ github.event.comment.user.login }}!
            You can now work on this issue. 🚀
