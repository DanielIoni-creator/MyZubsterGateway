name: Add Currency Label

on:
  issues:
    types: [opened]

jobs:
  add-label:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.issue.labels.*.name, 'bounty') }}
    steps:
      - name: Get issue body and check currency
        id: currency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }} --jq .body)
          if echo "$BODY" | grep -q "XMR (1 al giorno)"; then
            echo "label=bounty-xmr" >> $GITHUB_OUTPUT
          else
            echo "label=bounty" >> $GITHUB_OUTPUT
          fi

      - name: Add label
        if: ${{ steps.currency.outputs.label == 'bounty-xmr' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels \
            -X POST -f labels='["bounty-xmr"]'
