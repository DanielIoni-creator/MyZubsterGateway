name: Auto-assign free issues

on:
  issues:
    types: [opened]

jobs:
  assign:
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.issue.labels.*.name, 'free') }}
    steps:
      - name: Assign to opener
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          USERNAME=${{ github.event.issue.user.login }}
          gh issue edit $ISSUE_NUMBER --repo ${{ github.repository }} --add-assignee $USERNAME
          gh issue comment $ISSUE_NUMBER --repo ${{ github.repository }} --body "✅ Assigned! Thank you for your contribution. Looking forward to your PR! 🚀"
