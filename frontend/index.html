<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyZubster - Robot Ecosystem</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f3460 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px;
      max-width: 900px;
    }
    .logo {
      max-width: 300px;
      height: auto;
      margin-bottom: 30px;
      filter: drop-shadow(0 0 40px rgba(74, 144, 217, 0.3));
    }
    h1 {
      font-size: 3.5rem;
      margin: 20px 0;
      background: linear-gradient(45deg, #4A90D9, #9B59B6, #1ABC9C);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      font-size: 1.2rem;
      color: #a0a0b0;
      margin-bottom: 30px;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .feature {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.3s;
    }
    .feature:hover {
      transform: translateY(-5px);
      border-color: rgba(74, 144, 217, 0.5);
    }
    .feature h3 {
      margin: 10px 0;
      color: #4A90D9;
    }
    .feature p {
      font-size: 0.9rem;
      color: #a0a0b0;
    }
    .badge {
      display: inline-block;
      background: rgba(74, 144, 217, 0.15);
      padding: 10px 24px;
      border-radius: 20px;
      border: 1px solid rgba(74, 144, 217, 0.2);
      font-size: 0.9rem;
      margin-top: 30px;
    }
    .status {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2ECC71;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/assets/myzubster-logo.svg" alt="MyZubster Logo" class="logo">
    <h1>MyZubster</h1>
    <p class="subtitle">🤖 Decentralized Robot Ecosystem</p>
    
    <div class="features">
      <div class="feature">
        <h3>🔄 Swap</h3>
        <p>XMR ↔ MYZ in tempo reale</p>
      </div>
      <div class="feature">
        <h3>🏆 Rewards</h3>
        <p>Guadagna MYZ registrando</p>
      </div>
      <div class="feature">
        <h3>🤖 Robots</h3>
        <p>Ecosistema decentralizzato</p>
      </div>
      <div class="feature">
        <h3>🔗 Blockchain</h3>
        <p>Tokenizzazione su Tari</p>
      </div>
    </div>
    
    <div class="badge">
      <span class="status"></span>
      Gateway v1.0 • <span id="time"></span>
    </div>
  </div>
  
  <script>
    document.getElementById('time').textContent = new Date().toLocaleString('it-IT');
  </script>
</body>
</html>
