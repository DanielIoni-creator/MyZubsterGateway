<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Orti Urbani</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-green-700 mb-4">🌱 Mappa Orti Urbani</h1>
        
        <div class="flex justify-between items-center mb-4">
            <input type="text" id="searchInput" placeholder="Cerca coltura..." class="p-2 border rounded shadow-sm w-1/3">
            <button onclick="exportCSV()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 shadow">⬇️ Export CSV</button>
        </div>

        <div id="map" class="h-96 w-full rounded-lg shadow-lg border border-gray-300"></div>
    </div>

    <script>
        let ortiData = [];
        const map = L.map('map').setView([41.8719, 12.5674], 6); // Centro Italia

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const markers = L.layerGroup().addTo(map);

        function renderMap(data) {
            markers.clearLayers();
            data.forEach(orto => {
                const marker = L.marker([orto.lat, orto.lng]).addTo(markers);
                marker.bindPopup(`
                    <strong class="text-lg">${orto.name}</strong><br>
                    📏 Superficie: ${orto.area} mq<br>
                    🍅 Colture: ${orto.crops.join(', ')}
                `);
            });
        }

        fetch('/api/orti/map')
            .then(res => res.json())
            .then(data => {
                ortiData = data;
                renderMap(data);
            });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = ortiData.filter(o => 
                o.crops.some(c => c.toLowerCase().includes(term))
            );
            renderMap(filtered);
        });

        function exportCSV() {
            let csv = 'ID,Name,Area,Crops,Lat,Lng\n';
            ortiData.forEach(o => {
                csv += `${o.id},"${o.name}",${o.area},"${o.crops.join(', ')}",${o.lat},${o.lng}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'orti_export.csv';
            a.click();
        }
    </script>
</body>
</html>
