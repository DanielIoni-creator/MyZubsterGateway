server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- 健康检查端点（配合 Docker HEALTHCHECK）---
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # --- SPA 历史路由回退 ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 带内容哈希的静态资源：长缓存 ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- 压缩 ---
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml image/svg+xml;

    # --- 安全响应头 ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 日志：access/error 输出到 stdout/stderr，docker logs 直接可见 ---
    access_log /dev/stdout;
    error_log /dev/stderr;
}
