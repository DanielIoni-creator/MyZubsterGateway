server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Logging: send access/error logs to stdout/stderr so `docker logs` works ----
    access_log /dev/stdout;
    error_log /dev/stderr;

    # ---- Gzip compression ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml+rss
        application/xml
        text/javascript
        image/svg+xml;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- Health check endpoint (used by Docker HEALTHCHECK) ----
    location = /healthz {
        default_type text/plain;
        return 200 'ok\n';
    }

    # ---- Hashed static assets: cache aggressively (Vite emits content-hashed names) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback: all client-side routes resolve to index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
