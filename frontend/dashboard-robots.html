<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MyZubster - Robot Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}.header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:24px 32px;border-bottom:1px solid #334155}.header h1{font-size:24px;color:#38bdf8}.stats{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}.stat{background:#1e293b;padding:12px 20px;border-radius:8px;border:1px solid #334155}.stat .value{font-size:28px;font-weight:bold}.stat .label{font-size:11px;color:#94a3b8;text-transform:uppercase}.idle{color:#34d399}.working{color:#fbbf24}.delivering{color:#60a5fa}.dispute{color:#f87171}.container{max-width:1400px;margin:0 auto;padding:24px}.tabs{display:flex;gap:4px;margin-bottom:20px}.tab{padding:10px 20px;background:#1e293b;border:1px solid #334155;border-radius:8px 8px 0 0;cursor:pointer;color:#94a3b8;font-size:14px}.tab.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8;font-weight:600}.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}.robot-card{background:#1e293b;border-radius:12px;padding:20px;border:1px solid #334155;transition:transform .2s;cursor:pointer}.robot-card:hover{transform:translateY(-2px);border-color:#38bdf8}.robot-card .name{font-size:18px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}.status-dot.idle{background:#34d399}.status-dot.working{background:#fbbf24;animation:pulse 1.5s infinite}.status-dot.delivering{background:#60a5fa;animation:pulse 1.5s infinite}.status-dot.dispute{background:#f87171}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.detail-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:#94a3b8}.detail-row span:last-child{color:#e2e8f0}.detail-panel{background:#1e293b;border-radius:12px;padding:24px;border:1px solid #38bdf8;margin-top:16px;display:none}.detail-panel.active{display:block}.detail-panel h2{color:#38bdf8;margin-bottom:16px}.job-item{padding:10px;background:#0f172a;border-radius:6px;margin-bottom:8px;display:flex;justify-content:space-between;font-size:13px}.loading,.empty{text-align:center;padding:48px;color:#64748b}</style></head><body><div class="header"><h1>Robot Dashboard</h1><div class="stats"><div class="stat"><div class="value idle" id="cI">0</div><div class="label">Inattivi</div></div><div class="stat"><div class="value working" id="cW">0</div><div class="label">Al Lavoro</div></div><div class="stat"><div class="value delivering" id="cD">0</div><div class="label">In Consegna</div></div><div class="stat"><div class="value dispute" id="cX">0</div><div class="label">In Disputa</div></div></div></div><div class="container"><div class="tabs"><div class="tab active" onclick="fR('all')">Tutti</div><div class="tab" onclick="fR('idle')">Inattivi</div><div class="tab" onclick="fR('working')">Al Lavoro</div><div class="tab" onclick="fR('delivering')">In Consegna</div><div class="tab" onclick="fR('dispute')">In Disputa</div></div><div id="cc"><div class="loading">Caricamento robot...</div></div><div class="detail-panel" id="dp"><h2 id="dn"></h2><div id="dc"></div></div></div><script>var rb=[],af="all";async function ld(){try{var r=await fetch("/api/robot/status");var d=await r.json();rb=d.robots||d||[];rc()}catch(e){rb=[{robotId:"bot-1",name:"CleanerBot Alpha",status:"idle",type:"cleaning",reputation:98},{robotId:"bot-2",name:"DeliveryBot Beta",status:"working",type:"delivery",reputation:92,currentJob:"job-205"},{robotId:"bot-3",name:"CookBot Gamma",status:"delivering",type:"cooking",reputation:85,currentJob:"job-206"},{robotId:"bot-4",name:"RepairBot Delta",status:"idle",type:"repair",reputation:99},{robotId:"bot-5",name:"GuardBot Epsilon",status:"dispute",type:"security",reputation:70,currentJob:"job-200"}];rc()}}function fR(s){af=s;var ts=document.querySelectorAll(".tab");for(var i=0;i<ts.length;i++)ts[i].classList.remove("active");event.target.classList.add("active");rc()}function rc(){var c={idle:0,working:0,delivering:0,dispute:0};rb.forEach(function(r){if(c[r.status]!==undefined)c[r.status]++});document.getElementById("cI").textContent=c.idle;document.getElementById("cW").textContent=c.working;document.getElementById("cD").textContent=c.delivering;document.getElementById("cX").textContent=c.dispute;var fl=af==="all"?rb:rb.filter(function(r){return r.status===af});if(!fl.length){document.getElementById("cc").innerHTML="<div class=empty>Nessun robot in questo stato</div>";return}var h="<div class=card-grid>";fl.forEach(function(r){h+="<div class=robot-card onclick=sd('"+r.robotId+"')>";h+="<div class=name><span><span class="status-dot "+r.status+""></span>"+r.name+"</span><span style=font-size:12px;color:#64748b>"+r.robotId+"</span></div>";h+="<div class=detail-row><span>Stato</span><span>"+r.status+"</span></div>";h+="<div class=detail-row><span>Tipo</span><span>"+(r.type||"N/D")+"</span></div>";h+="<div class=detail-row><span>Reputazione</span><span>"+(r.reputation||0)+"/100</span></div>";h+="<div class=detail-row><span>Job</span><span>"+(r.currentJob||"Nessuno")+"</span></div></div>"});h+="</div>";document.getElementById("cc").innerHTML=h}function sd(rid){var r=rb.find(function(x){return x.robotId===rid});if(!r)return;document.getElementById("dn").textContent=r.name+" ("+r.robotId+")";document.getElementById("dc").innerHTML="<div class=detail-row><span>Stato</span><span>"+r.status+"</span></div>"+"<div class=detail-row><span>Tipo</span><span>"+(r.type||"N/D")+"</span></div>"+"<div class=detail-row><span>Reputazione</span><span>"+(r.reputation||0)+"/100</span></div>"+"<div class=detail-row><span>Job Corrente</span><span>"+(r.currentJob||"Nessuno")+"</span></div>"+"<div class=detail-row><span>Ultimo Lavoro</span><span>"+(r.lastJob?new Date(r.lastJob).toLocaleString():"N/D")+"</span></div>"+"<div class=job-history><strong>Storico Lavori:</strong>"+"<div class=job-item><span>Job #205</span><span>Completato</span></div>"+"<div class=job-item><span>Job #189</span><span>Completato</span></div>"+"<div class=job-item><span>Job #174</span><span>Completato</span></div></div>";document.getElementById("dp").classList.add("active")}ld();setInterval(ld,30000);</script></body></html>
