<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 Orto Urbano - MyZubster</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; margin: 0; padding: 20px; }
    .dashboard { max-width: 1200px; margin: 0 auto; }
    .header { background: linear-gradient(135deg, #2ecc71, #27ae60); padding: 30px; border-radius: 12px; color: white; text-align: center; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
    .stat-card { padding: 20px; border-radius: 12px; color: white; text-align: center; }
    .stat-card.ph { background: #3498db; }
    .stat-card.ec { background: #9b59b6; }
    .stat-card.temp { background: #e74c3c; }
    .stat-card.humidity { background: #1abc9c; }
    .stat-value { font-size: 2.5rem; font-weight: bold; }
    .history { background: white; padding: 20px; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8f9fa; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1>🌱 Orto Urbano - Rimini</h1>
      <p>Monitoraggio in tempo reale dei parametri del suolo</p>
    </div>
    <div class="stats-grid">
      <div class="stat-card ph"><h3>pH</h3><div class="stat-value" id="ph">--</div></div>
      <div class="stat-card ec"><h3>EC</h3><div class="stat-value" id="ec">--</div></div>
      <div class="stat-card temp"><h3>Temperatura</h3><div class="stat-value" id="temp">--</div></div>
      <div class="stat-card humidity"><h3>Umidità</h3><div class="stat-value" id="humidity">--</div></div>
    </div>
    <div class="history">
      <h2>📊 Storico dati</h2>
      <div id="history-data">Caricamento...</div>
    </div>
  </div>
  <script>
    async function loadData() {
      try {
        const res = await fetch('/api/sensors/garden/orto-rimini-001');
        const data = await res.json();
        if (data.success && data.data.length > 0) {
          const latest = data.data[0];
          document.getElementById('ph').textContent = latest.ph;
          document.getElementById('ec').textContent = latest.ec;
          document.getElementById('temp').textContent = latest.temperature + '°C';
          document.getElementById('humidity').textContent = latest.humidity + '%';
          let html = '<table><tr><th>Data/Ora</th><th>pH</th><th>EC</th><th>Temp</th><th>Umidità</th></tr>';
          data.data.slice(0, 10).forEach(d => {
            html += `<tr><td>${new Date(d.timestamp).toLocaleString()}</td><td>${d.ph}</td><td>${d.ec}</td><td>${d.temperature}°C</td><td>${d.humidity}%</td></tr>`;
          });
          html += '</table>';
          document.getElementById('history-data').innerHTML = html;
        }
      } catch(e) { console.error(e); }
    }
    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>
