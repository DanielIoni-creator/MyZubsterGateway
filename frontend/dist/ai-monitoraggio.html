<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 AI Monitoraggio - MyZubster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0e1a; padding: 20px; color: #e0e0e0; }
    .dashboard { max-width: 1400px; margin: 0 auto; }
    .header {
      text-align: center; margin-bottom: 30px; padding: 28px;
      background: linear-gradient(135deg, #1a1a3e, #0d1b2a); border-radius: 16px;
      border: 1px solid rgba(100, 149, 237, 0.2); position: relative; overflow: hidden;
    }
    .header::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(100,149,237,0.05) 0%, transparent 60%);
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
    .header h1 { font-size: 2.4rem; margin: 0; position: relative; }
    .header h1 span { color: #6c8cff; }
    .header p { margin: 10px 0 0; opacity: 0.7; font-size: 1rem; position: relative; }
    .status-badge { display: inline-block; margin-top: 12px; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; position: relative; }
    .status-badge.online { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); }
    .status-badge.offline { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); position: relative; overflow: hidden; }
    .kpi-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .kpi-card.anomalies::after { background: linear-gradient(90deg, #e74c3c, #f39c12); }
    .kpi-card.alerts::after { background: linear-gradient(90deg, #f39c12, #e74c3c); }
    .kpi-card.predictions::after { background: linear-gradient(90deg, #3498db, #2ecc71); }
    .kpi-card.threat::after { background: linear-gradient(90deg, #9b59b6, #e74c3c); }
    .kpi-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .kpi-label { font-size: 0.85rem; color: #8899aa; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-icon { font-size: 1.8rem; }
    .kpi-value { font-size: 2.2rem; font-weight: bold; }
    .kpi-value.danger { color: #e74c3c; }
    .kpi-value.warning { color: #f39c12; }
    .kpi-value.good { color: #2ecc71; }
    .kpi-trend { font-size: 0.8rem; margin-top: 4px; }
    .kpi-trend.up { color: #e74c3c; }
    .kpi-trend.down { color: #2ecc71; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; }
    .card h2 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .card h2 .badge-count { background: rgba(100,149,237,0.2); color: #6c8cff; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
    .anomaly-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
    .anomaly-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      border-radius: 8px; border-left: 3px solid; background: rgba(255,255,255,0.02);
      transition: background 0.2s; animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    .anomaly-item:hover { background: rgba(255,255,255,0.05); }
    .anomaly-item.critical { border-left-color: #e74c3c; }
    .anomaly-item.high { border-left-color: #f39c12; }
    .anomaly-item.medium { border-left-color: #3498db; }
    .anomaly-item.low { border-left-color: #2ecc71; }
    .anomaly-severity { font-size: 1.2rem; width: 30px; text-align: center; }
    .anomaly-content { flex: 1; }
    .anomaly-title { font-weight: 500; font-size: 0.9rem; }
    .anomaly-meta { font-size: 0.8rem; color: #8899aa; margin-top: 2px; }
    .anomaly-score { font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .anomaly-score.high { background: rgba(231,76,60,0.2); color: #e74c3c; }
    .anomaly-score.medium { background: rgba(243,156,18,0.2); color: #f39c12; }
    .anomaly-score.low { background: rgba(46,204,113,0.2); color: #2ecc71; }
    .alert-list { display: flex; flex-direction: column; gap: 8px; }
    .alert-item {
      display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
      border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
    }
    .alert-item.critical { border-left: 4px solid #e74c3c; }
    .alert-item.warning { border-left: 4px solid #f39c12; }
    .alert-item.info { border-left: 4px solid #3498db; }
    .alert-icon { font-size: 1.5rem; }
    .alert-body { flex: 1; }
    .alert-title { font-weight: 500; font-size: 0.9rem; }
    .alert-desc { font-size: 0.8rem; color: #8899aa; margin-top: 2px; }
    .alert-time { font-size: 0.75rem; color: #5a6a7a; white-space: nowrap; }
    .prediction-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .prediction-card {
      padding: 16px; border-radius: 10px; background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05); text-align: center;
    }
    .prediction-label { font-size: 0.8rem; color: #8899aa; }
    .prediction-value { font-size: 1.5rem; font-weight: bold; margin: 6px 0; }
    .prediction-value.up { color: #e74c3c; }
    .prediction-value.down { color: #2ecc71; }
    .prediction-value.stable { color: #3498db; }
    .prediction-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); margin-top: 8px; overflow: hidden; }
    .prediction-bar-inner { height: 100%; border-radius: 2px; transition: width 1s ease; }
    .prediction-bar-inner.anomaly { background: linear-gradient(90deg, #e74c3c, #f39c12); }
    .prediction-bar-inner.alert { background: linear-gradient(90deg, #f39c12, #e74c3c); }
    .prediction-bar-inner.performance { background: linear-gradient(90deg, #3498db, #2ecc71); }
    .chart-container { margin-top: 12px; }
    .chart-bar-group { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .chart-label { font-size: 0.8rem; color: #8899aa; width: 80px; text-align: right; }
    .chart-bar-wrapper { flex: 1; height: 20px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
    .chart-bar { height: 100%; border-radius: 4px; transition: width 1s ease; }
    .chart-bar.danger { background: linear-gradient(90deg, #e74c3c, #c0392b); }
    .chart-bar.warning { background: linear-gradient(90deg, #f39c12, #e67e22); }
    .chart-bar.good { background: linear-gradient(90deg, #2ecc71, #27ae60); }
    .chart-bar.info { background: linear-gradient(90deg, #3498db, #2980b9); }
    .chart-value { font-size: 0.8rem; font-weight: 600; min-width: 40px; }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 10px 12px; text-align: left; font-weight: 600; color: #8899aa; font-size: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
    td { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.85rem; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
    .badge.critical { background: rgba(231,76,60,0.2); color: #e74c3c; }
    .badge.high { background: rgba(243,156,18,0.2); color: #f39c12; }
    .badge.medium { background: rgba(52,152,219,0.2); color: #3498db; }
    .badge.low { background: rgba(46,204,113,0.2); color: #2ecc71; }
    .badge.resolved { background: rgba(46,204,113,0.15); color: #2ecc71; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer;
      font-size: 0.9rem; background: rgba(255,255,255,0.05); color: #e0e0e0;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
    .btn-primary { background: linear-gradient(135deg, #6c8cff, #5a7ae0); border-color: transparent; color: white; }
    .btn-primary:hover { background: linear-gradient(135deg, #7d9dff, #6c8cff); }
    .btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); border-color: transparent; color: white; }
    .btn-danger:hover { background: linear-gradient(135deg, #f05a4a, #d44a40); }
    .loading { text-align: center; font-size: 1.5rem; padding: 60px; color: #6c8cff; }
    .loading .spinner { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(108,140,255,0.2); border-top-color: #6c8cff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { text-align: center; padding: 40px; color: #e74c3c; }
    .empty { text-align: center; padding: 30px; color: #5a6a7a; }
    .last-update { text-align: right; color: #5a6a7a; font-size: 0.8rem; margin-top: 12px; }
    .section-tabs { display: flex; gap: 4px; margin-bottom: 16px; background: rgba(255,255,255,0.03); border-radius: 8px; padding: 4px; }
    .tab-btn { padding: 8px 16px; border: none; background: transparent; color: #8899aa; cursor: pointer; border-radius: 6px; font-size: 0.85rem; transition: all 0.2s; }
    .tab-btn.active { background: rgba(108,140,255,0.15); color: #6c8cff; }
    .tab-btn:hover:not(.active) { color: #e0e0e0; }
    .timeline { position: relative; padding-left: 24px; }
    .timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.08); }
    .timeline-item { position: relative; padding: 0 0 20px 20px; }
    .timeline-item::before { content: ''; position: absolute; left: -20px; top: 6px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid; }
    .timeline-item.critical::before { background: rgba(231,76,60,0.3); border-color: #e74c3c; }
    .timeline-item.warning::before { background: rgba(243,156,18,0.3); border-color: #f39c12; }
    .timeline-item.info::before { background: rgba(52,152,219,0.3); border-color: #3498db; }
    .timeline-time { font-size: 0.75rem; color: #5a6a7a; }
    .timeline-title { font-weight: 500; font-size: 0.9rem; margin-top: 2px; }
    .timeline-desc { font-size: 0.8rem; color: #8899aa; margin-top: 2px; }
    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
      .prediction-grid { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .header h1 { font-size: 1.5rem; }
      .kpi-value { font-size: 1.6rem; }
    }
    @media (max-width: 480px) {
      .kpi-grid { grid-template-columns: 1fr; }
      body { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="dashboard" id="app">
    <div class="loading"><div class="spinner"></div><br>🤖 Caricamento AI Monitoraggio...</div>
  </div>
  <script>
    const app = document.getElementById('app');
    let activeTab = 'anomalies';
    let demoData = null;

    function generateDemoData() {
      const now = Date.now();
      const anomalyTypes = [
        { title: 'Picco di traffico anomalo', desc: 'Richiesta API > 1000 req/s da IP sconosciuto', severity: 'critical', score: 97 },
        { title: 'Tentativo di accesso non autorizzato', desc: 'Login fallito da 3 indirizzi IP diversi', severity: 'critical', score: 94 },
        { title: 'Deviazione pattern di pagamento', desc: 'Importo transazione fuori dal range tipico (media ± 3σ)', severity: 'high', score: 87 },
        { title: 'Latenza API in aumento', desc: 'Tempo di risposta medio > 500ms, trend in crescita', severity: 'high', score: 82 },
        { title: 'Pattern orario anomalo', desc: 'Attività di sistema in ore non lavorative (03:00-05:00)', severity: 'medium', score: 65 },
        { title: 'Disconnessione sensore IoT', desc: 'Sensore temperatura orto urbano #12 off-line da 15 min', severity: 'medium', score: 58 },
        { title: 'Variazione saldo inattesa', desc: 'Saldo wallet XMR diminuito del 12% in 1 ora', severity: 'medium', score: 52 },
        { title: 'Uso CPU elevato', desc: 'CPU robot #EVA-03 al 92% per 5 minuti consecutivi', severity: 'low', score: 38 },
        { title: 'Cache miss ratio alto', desc: 'Cache hit rate sceso sotto 70% nelle ultime 2 ore', severity: 'low', score: 31 }
      ];
      const alerts = [
        { type: 'critical', title: '🚨 Allarme Sicurezza', desc: 'Rilevato tentativo di intrusione - blocco automatico IP attivato' },
        { type: 'critical', title: '⚠️ Anomalia Pagamenti', desc: 'Transazione #TX-8842 sospetta - verificare con 2-of-3 escrow' },
        { type: 'warning', title: '📊 Superata soglia', desc: 'Traffico API oltre 800 req/s - considerare scaling orizzontale' },
        { type: 'warning', title: '🔋 Robot in manutenzione', desc: 'Robot EVA-02 richiede manutenzione programmata (1000h operative)' },
        { type: 'info', title: '📈 Trend positivo', desc: 'Accuratezza previsioni AI in aumento del 5% questa settimana' },
        { type: 'info', title: '🔔 Nuova feature', desc: 'Sistema di rilevamento anomalie addestrato su nuovi pattern' }
      ];
      const predictions = {
        anomalyTrend: { value: '+23%', direction: 'up', label: 'Previsione anomalie prossime 24h', bar: 73 },
        alertVolume: { value: '+12%', direction: 'up', label: 'Volume allarmi previsto', bar: 58 },
        systemHealth: { value: '87%', direction: 'stable', label: 'Salute sistema', bar: 87 },
        predictionAccuracy: { value: '94.2%', direction: 'stable', label: 'Accuratezza predizioni', bar: 94 }
      };
      const hourlyAnomalies = [12, 8, 15, 5, 3, 7, 14, 18, 22, 16, 9, 4, 6, 11, 19, 25, 30, 28, 21, 15, 10, 8, 13, 17];
      const anomalySources = [
        { name: 'API Gateway', count: 47, trend: 'up' },
        { name: 'Wallet Service', count: 23, trend: 'down' },
        { name: 'Robot Sensors', count: 18, trend: 'up' },
        { name: 'Payment Engine', count: 12, trend: 'stable' },
        { name: 'IoT Network', count: 8, trend: 'down' }
      ];

      return { anomalyTypes, alerts, predictions, hourlyAnomalies, anomalySources };
    }

    function renderDashboard() {
      const data = demoData || generateDemoData();
      const { anomalyTypes, alerts, predictions, hourlyAnomalies, anomalySources } = data;
      const totalAnomalies = anomalyTypes.reduce((s, a) => s + (a.severity === 'critical' ? 1 : 0), 0);
      const activeAlerts = alerts.filter(a => a.type === 'critical' || a.type === 'warning').length;

      app.innerHTML = `
        <div class="header">
          <h1>🤖 AI <span>Monitoraggio</span></h1>
          <p>Rilevamento anomalie in tempo reale · Allarmi intelligenti · Previsioni AI</p>
          <span class="status-badge online">● Sistema attivo - ${new Date().toLocaleString('it-IT')}</span>
        </div>

        <div class="kpi-grid">
          <div class="kpi-card anomalies">
            <div class="kpi-header">
              <span class="kpi-label">Anomalie Critiche</span>
              <span class="kpi-icon">🚨</span>
            </div>
            <div class="kpi-value danger">${totalAnomalies}</div>
            <div class="kpi-trend up">↑ +15% rispetto a ieri</div>
          </div>
          <div class="kpi-card alerts">
            <div class="kpi-header">
              <span class="kpi-label">Allarmi Attivi</span>
              <span class="kpi-icon">🔔</span>
            </div>
            <div class="kpi-value warning">${activeAlerts}</div>
            <div class="kpi-trend up">↑ +3 nuovi allarmi</div>
          </div>
          <div class="kpi-card predictions">
            <div class="kpi-header">
              <span class="kpi-label">Accuratezza AI</span>
              <span class="kpi-icon">🎯</span>
            </div>
            <div class="kpi-value good">${predictions.predictionAccuracy.value}</div>
            <div class="kpi-trend down">↑ +5% questo mese</div>
          </div>
          <div class="kpi-card threat">
            <div class="kpi-header">
              <span class="kpi-label">Threat Level</span>
              <span class="kpi-icon">🛡️</span>
            </div>
            <div class="kpi-value warning">MEDIO</div>
            <div class="kpi-trend">${anomalyTypes.length} eventi rilevati</div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h2>⚠️ Anomalie in Tempo Reale <span class="badge-count">${anomalyTypes.length}</span></h2>
            <div class="anomaly-list">
              ${anomalyTypes.map(a => {
                const icons = { critical: '🔴', high: '🟠', medium: '🔵', low: '🟢' };
                const scores = { critical: 'high', high: 'medium', medium: 'medium', low: 'low' };
                return '<div class="anomaly-item ' + a.severity + '">' +
                  '<div class="anomaly-severity">' + (icons[a.severity] || '⚪') + '</div>' +
                  '<div class="anomaly-content">' +
                    '<div class="anomaly-title">' + a.title + '</div>' +
                    '<div class="anomaly-meta">' + a.desc + '</div>' +
                  '</div>' +
                  '<span class="anomaly-score ' + (scores[a.severity]) + '">' + a.score + '%</span>' +
                '</div>';
              }).join('')}
            </div>
          </div>

          <div class="card">
            <h2>🔔 Allarmi Intelligenti <span class="badge-count">${alerts.length}</span></h2>
            <div class="alert-list">
              ${alerts.map(a => {
                const icons = { critical: '🚨', warning: '⚠️', info: 'ℹ️' };
                return '<div class="alert-item ' + a.type + '">' +
                  '<div class="alert-icon">' + (icons[a.type] || '📌') + '</div>' +
                  '<div class="alert-body">' +
                    '<div class="alert-title">' + a.title + '</div>' +
                    '<div class="alert-desc">' + a.desc + '</div>' +
                  '</div>' +
                  '<div class="alert-time">' + new Date(Date.now() - Math.random() * 3600000).toLocaleTimeString('it-IT') + '</div>' +
                '</div>';
              }).join('')}
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom: 24px;">
          <h2>📈 Previsioni AI</h2>
          <div class="prediction-grid">
            <div class="prediction-card">
              <div class="prediction-label">${predictions.anomalyTrend.label}</div>
              <div class="prediction-value ${predictions.anomalyTrend.direction}">${predictions.anomalyTrend.value}</div>
              <div class="prediction-bar"><div class="prediction-bar-inner anomaly" style="width: ${predictions.anomalyTrend.bar}%"></div></div>
            </div>
            <div class="prediction-card">
              <div class="prediction-label">${predictions.alertVolume.label}</div>
              <div class="prediction-value ${predictions.alertVolume.direction}">${predictions.alertVolume.value}</div>
              <div class="prediction-bar"><div class="prediction-bar-inner alert" style="width: ${predictions.alertVolume.bar}%"></div></div>
            </div>
            <div class="prediction-card">
              <div class="prediction-label">${predictions.systemHealth.label}</div>
              <div class="prediction-value ${predictions.systemHealth.direction}">${predictions.systemHealth.value}</div>
              <div class="prediction-bar"><div class="prediction-bar-inner performance" style="width: ${predictions.systemHealth.bar}%"></div></div>
            </div>
            <div class="prediction-card">
              <div class="prediction-label">${predictions.predictionAccuracy.label}</div>
              <div class="prediction-value ${predictions.predictionAccuracy.direction}">${predictions.predictionAccuracy.value}</div>
              <div class="prediction-bar"><div class="prediction-bar-inner performance" style="width: ${predictions.predictionAccuracy.bar}%"></div></div>
            </div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h2>📊 Distribuzione Oraria Anomalie</h2>
            <div class="chart-container">
              ${hourlyAnomalies.map((val, i) => {
                const pct = (val / 30) * 100;
                const cls = pct > 66 ? 'danger' : (pct > 33 ? 'warning' : 'info');
                const hour = i.toString().padStart(2, '0') + ':00';
                return '<div class="chart-bar-group"><div class="chart-label">' + hour + '</div><div class="chart-bar-wrapper"><div class="chart-bar ' + cls + '" style="width: ' + pct + '%"></div></div><div class="chart-value">' + val + '</div></div>';
              }).join('')}
            </div>
          </div>

          <div class="card">
            <h2>📡 Fonti Anomalie</h2>
            <div class="table-container">
              <table>
                <thead><tr><th>Fonte</th><th>Anomalie</th><th>Trend</th><th>Distribuzione</th></tr></thead>
                <tbody>
                  ${anomalySources.map(s => {
                    const maxCount = Math.max(...anomalySources.map(x => x.count));
                    const pct = (s.count / maxCount) * 100;
                    const trendIcon = s.trend === 'up' ? '📈' : (s.trend === 'down' ? '📉' : '➡️');
                    const trendColor = s.trend === 'up' ? 'danger' : (s.trend === 'down' ? 'good' : '');
                    return '<tr><td>' + s.name + '</td><td><strong>' + s.count + '</strong></td><td><span class="kpi-value ' + trendColor + '" style="font-size: 1rem;">' + trendIcon + '</span></td><td><div class="chart-bar-wrapper" style="height: 12px;"><div class="chart-bar info" style="width: ' + pct + '%; height: 12px;"></div></div></td></tr>';
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="card" style="margin-bottom: 24px;">
          <h2>📜 Storico Eventi AI</h2>
          <div class="timeline">
            ${alerts.slice(0, 4).map((a, i) => {
              const time = new Date(Date.now() - (i * 1800000 + Math.random() * 900000));
              return '<div class="timeline-item ' + a.type + '">' +
                '<div class="timeline-time">' + time.toLocaleString('it-IT') + '</div>' +
                '<div class="timeline-title">' + a.title + '</div>' +
                '<div class="timeline-desc">' + a.desc + '</div>' +
              '</div>';
            }).join('')}
          </div>
        </div>

        <div class="card">
          <h2>📤 Strumenti</h2>
          <div class="btn-group">
            <button class="btn btn-primary" onclick="exportReport()">📊 Esporta Report CSV</button>
            <button class="btn" onclick="refreshData()">🔄 Aggiorna Dati</button>
            <button class="btn btn-danger" onclick="simulateAnomaly()">🔴 Simula Anomalia</button>
          </div>
          <p style="margin-top: 12px; color: #5a6a7a; font-size: 0.8rem;">Anomalie totali: ${anomalyTypes.length} | Allarmi attivi: ${activeAlerts} | Accuratezza AI: ${predictions.predictionAccuracy.value}</p>
        </div>

        <div class="last-update">Ultimo aggiornamento: ${new Date().toLocaleString('it-IT')} · Aggiornamento automatico ogni 30s</div>
      `;
    }

    function exportReport() {
      const data = demoData || generateDemoData();
      let csv = 'Tipo,Titolo,Descrizione,Severità,Timestamp\n';
      const now = new Date();
      data.anomalyTypes.forEach(a => {
        csv += '"Anomalia","' + a.title + '","' + a.desc + '","' + a.severity + ' - ' + a.score + '%","' + now.toLocaleString('it-IT') + '"\n';
      });
      data.alerts.forEach(a => {
        csv += '"Allarme","' + a.title + '","' + a.desc + '","' + a.type + '","' + now.toLocaleString('it-IT') + '"\n';
      });
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ai-monitoraggio-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function refreshData() {
      demoData = generateDemoData();
      renderDashboard();
    }

    function simulateAnomaly() {
      const newAnomaly = {
        title: '🔴 Anomalia simulata - ' + new Date().toLocaleTimeString('it-IT'),
        desc: 'Anomalia generata manualmente per test del sistema di monitoraggio',
        severity: ['critical', 'high', 'medium'][Math.floor(Math.random() * 3)],
        score: 70 + Math.floor(Math.random() * 30)
      };
      const data = demoData || generateDemoData();
      data.anomalyTypes.unshift(newAnomaly);
      if (data.anomalyTypes.length > 12) data.anomalyTypes.pop();
      renderDashboard();
      document.querySelector('.anomaly-list .anomaly-item:first-child')?.scrollIntoView({ behavior: 'smooth' });
    }

    async function loadData() {
      try {
        const res = await fetch('/api/ai/monitoraggio');
        if (res.ok) {
          const apiData = await res.json();
          if (apiData.data) {
            demoData = apiData.data;
          }
        }
      } catch(e) {
        // Use demo data if API unavailable
      }
      if (!demoData) demoData = generateDemoData();
      renderDashboard();
    }

    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
