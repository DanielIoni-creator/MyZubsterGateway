<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👛 Portafoglio unificato MYZ/XMR - MyZubster</title>

  <!-- No CDN: the chart is inline SVG and the logic is a local script. -->
  <script src="./assets/wallet-dashboard.js"></script>

  <style>
    :root {
      --accent: #f7931a;
      --accent-2: #2ecc71;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #eef1f6;
      --text: #1f2733;
      --text-soft: #5b6675;
      --border: #e2e7ee;
      --shadow: 0 10px 30px rgba(20, 30, 50, 0.08);
      --radius: 14px;
      --credit: #22a06b;
      --debit: #d94f4f;
      --warn: #d99000;
    }
    [data-theme="dark"] {
      --bg: #10141b;
      --surface: #171d27;
      --surface-2: #1f2733;
      --text: #e8edf4;
      --text-soft: #94a1b2;
      --border: #2a3444;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px 20px 48px;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .wrap { max-width: 1120px; margin: 0 auto; }

    header { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
    h1 { font-size: 24px; margin: 0; }
    .spacer { flex: 1; }
    .btn {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 14px;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #1b1200; font-weight: 600; }

    .pill { font-size: 12px; color: var(--text-soft); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; }
    .pill.live::before { content: "●"; color: var(--accent-2); margin-right: 6px; }
    .pill.demo::before { content: "●"; color: var(--warn); margin-right: 6px; }

    .alerts { display: grid; gap: 8px; margin-bottom: 18px; }
    .alert { border-radius: 10px; padding: 10px 14px; font-size: 14px; border: 1px solid var(--border); background: var(--surface); }
    .alert.warning { border-left: 4px solid var(--warn); }
    .alert.error { border-left: 4px solid var(--debit); }
    .alert.info { border-left: 4px solid var(--text-soft); }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 18px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .card h2 { margin: 0 0 4px; font-size: 14px; color: var(--text-soft); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .amount { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; word-break: break-all; }
    .sub { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: var(--text-soft); }
    .sub b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
    .panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .panel-head h2 { margin: 0; font-size: 16px; }
    select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; }

    svg.chart { width: 100%; height: 180px; display: block; }
    .chart-path { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .chart-grid { stroke: var(--border); stroke-width: 1; }
    .chart-axis { fill: var(--text-soft); font-size: 11px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; color: var(--text-soft); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    td { padding: 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: none; }
    .dir-CREDIT { color: var(--credit); font-weight: 600; }
    .dir-DEBIT { color: var(--debit); font-weight: 600; }
    .state { font-size: 11px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; color: var(--text-soft); }
    .empty { color: var(--text-soft); padding: 24px 10px; text-align: center; }
    .scroll { overflow-x: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>👛 Portafoglio unificato <span style="color:var(--accent)">MYZ</span> / <span style="color:var(--accent-2)">XMR</span></h1>
      <span id="source" class="pill demo">…</span>
      <span class="spacer"></span>
      <button id="export" class="btn primary">⬇ Esporta CSV</button>
      <button id="theme" class="btn">☾ Tema</button>
    </header>

    <div id="alerts" class="alerts"></div>
    <div id="cards" class="cards"></div>

    <section class="panel">
      <div class="panel-head">
        <h2>📈 Andamento saldo</h2>
        <span class="spacer"></span>
        <select id="chart-currency"><option value="XMR">XMR</option><option value="MYZ">MYZ</option></select>
        <select id="chart-days">
          <option value="7">7 giorni</option>
          <option value="14" selected>14 giorni</option>
          <option value="30">30 giorni</option>
        </select>
      </div>
      <svg id="chart" class="chart" viewBox="0 0 720 200" preserveAspectRatio="none" role="img" aria-label="Andamento del saldo"></svg>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>⚡ Transazioni in tempo reale</h2>
        <span class="spacer"></span>
        <span id="updated" class="pill">—</span>
      </div>
      <div class="scroll"><table>
        <thead><tr><th>Data</th><th>Valuta</th><th>Direzione</th><th>Importo</th><th>Stato</th><th>Controparte</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
  </div>

<script>
(function () {
  'use strict';
  var W = window.WalletDashboard;
  var USER = new URLSearchParams(location.search).get('userId') || 'demo-user';
  var THRESHOLDS = { XMR: { low: 0.1 }, MYZ: { low: 50 } };
  var POLL_MS = 10000;
  var state = { transactions: [], live: false };

  // Renders with sample data when the gateway is unreachable, so the page is
  // never a blank screen — and says so, so nobody mistakes it for real money.
  function demoData() {
    var out = [];
    var now = Date.now();
    var plan = [
      [13, 'XMR', 'CREDIT', 0.42, 'POSTED', 'bounty-payout'],
      [11, 'MYZ', 'CREDIT', 600, 'POSTED', 'ledger-credit'],
      [9, 'XMR', 'DEBIT', 0.12, 'POSTED', 'station-7'],
      [6, 'MYZ', 'DEBIT', 120, 'POSTED', 'robot-hire'],
      [4, 'XMR', 'CREDIT', 0.08, 'POSTED', 'garden-bounty'],
      [2, 'MYZ', 'CREDIT', 45, 'POSTED', 'referral'],
      [1, 'XMR', 'DEBIT', 0.35, 'POSTED', 'withdrawal'],
      [0, 'XMR', 'CREDIT', 0.05, 'PENDING', 'incoming'],
    ];
    plan.forEach(function (p, i) {
      out.push({
        createdAt: new Date(now - p[0] * 86400000).toISOString(),
        currency: p[1], direction: p[2], amount: p[3], state: p[4],
        counterparty: p[5], reference: 'demo-' + i,
      });
    });
    return out;
  }

  function el(id) { return document.getElementById(id); }

  function renderCards(balances) {
    el('cards').innerHTML = Object.keys(balances).map(function (currency) {
      var b = balances[currency];
      return '<div class="card">'
        + '<h2>Saldo ' + currency + '</h2>'
        + '<div class="amount">' + W.formatAmount(b.available, currency) + '</div>'
        + '<div class="sub">'
        + '<span>In attesa <b>' + W.formatAmount(b.pending, currency) + '</b></span>'
        + '<span>Entrate <b>' + W.formatAmount(b.inflow, currency) + '</b></span>'
        + '<span>Uscite <b>' + W.formatAmount(b.outflow, currency) + '</b></span>'
        + '</div></div>';
    }).join('');
  }

  function renderAlerts(balances) {
    var alerts = W.balanceAlerts(balances, THRESHOLDS);
    el('alerts').innerHTML = alerts.map(function (a) {
      return '<div class="alert ' + a.level + '">' + a.message + '</div>';
    }).join('');
  }

  function renderChart() {
    var currency = el('chart-currency').value;
    var days = Number(el('chart-days').value);
    var series = W.buildSeries(state.transactions, { currency: currency, days: days });
    // The plot occupies the top 160px; the strip below it belongs to the axis
    // labels, so a line that dives to the floor cannot collide with a date.
    var path = W.sparklinePath(series, 720, 160, 18);

    var first = series[0], last = series[series.length - 1];
    var grid = [0.25, 0.5, 0.75].map(function (f) {
      return '<line class="chart-grid" x1="0" y1="' + (160 * f) + '" x2="720" y2="' + (160 * f) + '" />';
    }).join('');

    el('chart').innerHTML = grid
      + '<path class="chart-path" d="' + path + '" />'
      + '<text class="chart-axis" x="4" y="192">' + (first ? first.date : '') + '</text>'
      + '<text class="chart-axis" x="716" y="192" text-anchor="end">' + (last ? last.date : '') + '</text>'
      + '<text class="chart-axis" x="716" y="16" text-anchor="end">'
      + (last ? W.formatAmount(last.balance, currency) + ' ' + currency : '') + '</text>';
  }

  function renderRows() {
    var rows = state.transactions.slice().sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; }).slice(0, 25);
    if (!rows.length) { el('rows').innerHTML = '<tr><td colspan="6" class="empty">Nessuna transazione</td></tr>'; return; }

    el('rows').innerHTML = rows.map(function (t) {
      return '<tr>'
        + '<td>' + t.createdAt.slice(0, 16).replace('T', ' ') + '</td>'
        + '<td>' + t.currency + '</td>'
        + '<td class="dir-' + t.direction + '">' + (t.direction === 'CREDIT' ? '↓ Entrata' : '↑ Uscita') + '</td>'
        + '<td>' + W.formatAmount(t.amount, t.currency) + '</td>'
        + '<td><span class="state">' + t.state + '</span></td>'
        + '<td>' + (t.counterparty || '—') + '</td>'
        + '</tr>';
    }).join('');
  }

  function renderAll() {
    var balances = W.summariseBalances(state.transactions);
    renderCards(balances);
    renderAlerts(balances);
    renderChart();
    renderRows();
    el('source').className = 'pill ' + (state.live ? 'live' : 'demo');
    el('source').textContent = state.live ? 'Dati live' : 'Dati dimostrativi';
    el('updated').textContent = 'Aggiornato ' + new Date().toISOString().slice(11, 19) + ' UTC';
  }

  function load() {
    fetch('/api/wallet/' + encodeURIComponent(USER) + '/transactions?limit=200', { headers: { Accept: 'application/json' } })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (body) {
        var items = (body && body.items) || [];
        state.transactions = items;
        state.live = true;
        renderAll();
      })
      .catch(function () {
        if (!state.live && state.transactions.length === 0) { state.transactions = demoData(); renderAll(); }
      });
  }

  el('export').addEventListener('click', function () {
    var blob = new Blob([W.toCsv(state.transactions)], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'wallet-' + USER + '-' + new Date().toISOString().slice(0, 10) + '.csv';
    link.click();
    URL.revokeObjectURL(link.href);
  });

  el('theme').addEventListener('click', function () {
    var root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  });

  el('chart-currency').addEventListener('change', renderChart);
  el('chart-days').addEventListener('change', renderChart);

  state.transactions = demoData();
  renderAll();
  load();
  setInterval(load, POLL_MS);
})();
</script>
</body>
</html>
